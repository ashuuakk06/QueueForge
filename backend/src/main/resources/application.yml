server:
  port: ${PORT:8080}
spring:
  application:
    name: queueforge-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/queueforge}
    username: ${SPRING_DATASOURCE_USERNAME:queueforge}
    password: ${SPRING_DATASOURCE_PASSWORD:queueforge-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/queueforge_events}
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
app:
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:queueforge-local-jwt-secret-please-change-123456}
    expiration: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  worker:
    enabled: ${APP_WORKER_ENABLED:true}
    concurrency: ${APP_WORKER_CONCURRENCY:4}
    id: ${APP_WORKER_ID:}
  demo:
    seed: ${APP_DEMO_SEED:false}

