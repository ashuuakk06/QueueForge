name: queueforge

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-queueforge}
      POSTGRES_USER: ${POSTGRES_USER:-queueforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-queueforge-local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-queueforge} -d ${POSTGRES_DB:-queueforge}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mongodb:
    image: mongo:8
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-queueforge}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-queueforge-local}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 8s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    image: queueforge-api:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-queueforge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-queueforge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-queueforge-local}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-queueforge}:${MONGO_ROOT_PASSWORD:-queueforge-local}@mongodb:27017/queueforge_events?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-queueforge-local-jwt-secret-please-change-123456}
      APP_DEMO_SEED: ${APP_DEMO_SEED:-true}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:8080
      APP_SCHEDULER_ENABLED: true
      APP_WORKER_ENABLED: false
      APP_WORKER_CONCURRENCY: ${APP_WORKER_CONCURRENCY:-4}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: queueforge-api:latest
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-queueforge}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-queueforge}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-queueforge-local}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-queueforge}:${MONGO_ROOT_PASSWORD:-queueforge-local}@mongodb:27017/queueforge_events?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-queueforge-local-jwt-secret-please-change-123456}
      APP_DEMO_SEED: false
      APP_SCHEDULER_ENABLED: false
      APP_WORKER_ENABLED: true
      APP_WORKER_CONCURRENCY: ${APP_WORKER_CONCURRENCY:-4}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mongo_data:

